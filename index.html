<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта - Аналітична панель</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@2.9.6/build/vanilla-calendar.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Карта-панель">


    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-color: rgba(255, 255, 255, 0.85);
            --blur-effect: backdrop-filter: blur(12px);
            --border-color: rgba(0, 0, 0, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --text-color: #2c2c2c;
            --accent-color: #007aff;
            --transition-speed: 0.3s;
            --main-bg: #eef1f4;
            --icon-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        body.dark-theme {
            --bg-color: rgba(28, 28, 30, 0.85);
            --border-color: rgba(255, 255, 255, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --text-color: #f5f5f7;
            --main-bg: #1c1c1e;
            --icon-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }
        
        /* --- GLOBAL STYLES --- */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            background-color: var(--main-bg);
            overflow: hidden;
            position: fixed; /* Prevents pull-to-refresh on mobile */
        }
        
        #map {
            width: 100%;
            height: 100%;
        }

        /* --- UI CONTROLS (BUTTONS, PANELS) --- */
        .ui-element {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px var(--shadow-color);
            border-radius: 12px;
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
            transition: all var(--transition-speed);
        }

        #panel-toggle-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1001;
        }

        #panel-toggle-button, #toolbar-settings-button {
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-color);
            background: transparent;
            border: none;
            text-shadow: var(--icon-shadow);
            transition: all var(--transition-speed);
        }
        #toolbar-settings-button {
            position: absolute;
            bottom: 10px;
            left: 10px;
            z-index: 1001;
        }

        #panel-toggle-button:hover, #toolbar-settings-button:hover {
            transform: scale(1.1);
            color: var(--accent-color);
        }

        #action-buttons {
            /* This is now a dynamic container for visible buttons */
        }
        
        .action-button {
            position: absolute;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: grab;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.2s, transform 0.2s;
            text-shadow: var(--icon-shadow);
            z-index: 1001;
        }
        
        .action-button.grabbing {
            cursor: grabbing;
            z-index: 1002;
        }

        .action-button:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        #sync-badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #ff3b30;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(40%, -40%);
            display: none;
            border: 2px solid var(--main-bg);
            text-shadow: none;
        }

        /* --- ANALYTICS PANEL --- */
        #top-panel {
            position: absolute;
            top: 65px;
            left: 10px;
            width: calc(100% - 20px);
            max-width: 1200px;
            z-index: 1000;
            transition: opacity var(--transition-speed), transform var(--transition-speed), visibility var(--transition-speed);
            transform-origin: top left;
        }

        #top-panel.collapsed {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
        }

        .panel-header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }
        .panel-header h2 { margin: 0; font-size: 18px; color: var(--text-color); }
        body.dark-theme .panel-header h2 { color: var(--text-color); }

        .panel-content {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
        }
        
        .panel-column {
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            min-width: 280px;
            flex: 1;
        }
        .panel-column h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: 600;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-color);
        }
        body.dark-theme .panel-column h3 { color: var(--text-color); }

        #events-column { flex-basis: 35%; }
        #layers-column { flex-basis: 25%; }
        #calendar-column { flex-basis: 300px; flex-grow: 0; }

        /* --- EVENTS AND LAYERS LIST --- */
        #events-list { list-style: none; padding: 0; margin: 0; }
        #events-list li { padding: 10px 8px; font-size: 14px; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; color: var(--text-color); }
        body.dark-theme #events-list li { color: var(--text-color); }
        #events-list li:hover, #events-list li.highlighted { background-color: rgba(0, 122, 255, 0.1); }
        .layer-legend-color { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border-radius: 3px; vertical-align: middle;}

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2500;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.visible {
            opacity: 1; visibility: visible;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 25px var(--shadow-color);
            width: 90%;
            max-width: 500px;
            position: relative;
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
        }
        
        .modal-content h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        body.dark-theme .modal-content h3 { color: var(--text-color); }


        .modal-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 28px;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-color);
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .modal-close:hover { opacity: 1; }
        
        #modal-info p { margin: 8px 0; color: var(--text-color); }
        body.dark-theme #modal-info p { color: var(--text-color); }
        #modal-info p strong { color: #555; }
        body.dark-theme #modal-info p strong { color: #aaa; }
        #modal-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        #modal-actions button {
            border: none;
            background: var(--accent-color);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        #modal-actions button:hover {
            background-color: #0056b3;
        }

        /* --- TOOLBAR SETTINGS MODAL --- */
        #toolbar-button-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .toolbar-button-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: rgba(128,128,128,0.1);
            border-radius: 8px;
        }

        .toolbar-button-item label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-color);
            cursor: pointer;
        }

        .toolbar-button-item i {
            font-size: 18px;
            width: 20px;
            text-align: center;
            color: var(--accent-color);
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* --- DRAWING & CUSTOM POINT MODAL STYLES --- */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; color: var(--text-color); }
        .form-group input[type="text"], .form-group input[type="file"], .form-group input[type="number"] {
            width: calc(100% - 22px); padding: 10px; border: 1px solid var(--border-color);
            background: transparent; color: var(--text-color); border-radius: 6px; font-size: 14px;
        }
        .source-toggle {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-around;
            background-color: rgba(0,0,0,0.05); padding: 8px; border-radius: 6px;
        }
        #manual-coords-group {
            display: flex;
            gap: 10px;
        }
        #place-point-submit {
            width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border: none;
            background: var(--accent-color); color: white; border-radius: 8px; cursor: pointer;
            margin-top: 15px; transition: background-color 0.2s;
        }

        #icon-collection-grid, #military-icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
            padding: 5px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        .icon-collection-item, .military-icon-item {
            width: 40px;
            height: 40px;
            object-fit: contain;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 2px;
            transition: border-color 0.2s;
            background-color: rgba(255,255,255,0.5);
        }
         body.dark-theme .icon-collection-item, body.dark-theme .military-icon-item {
             background-color: rgba(0,0,0,0.2);
         }

        .icon-collection-item.selected, .military-icon-item.selected {
            border-color: var(--accent-color);
        }
        #military-icon-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .category-button {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .category-button.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        
        #drawing-toolbar, #mortar-toolbar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px;
        }
        .draw-tool-button {
            width: 36px;
            height: 36px;
            background: none;
            border: none;
            font-size: 16px;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .draw-tool-button:hover {
            background-color: rgba(128,128,128,0.2);
        }
        .draw-tool-button.active {
            background-color: var(--accent-color);
            color: white;
        }
        #drawing-color-picker { -webkit-appearance: none; -moz-appearance: none; appearance: none; width: 28px; height: 28px; background-color: transparent; border: none; cursor: pointer; }
        #drawing-color-picker::-webkit-color-swatch { border-radius: 50%; border: 2px solid var(--border-color); }
        .distance-label {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-weight: bold;
            box-shadow: 0 1px 5px var(--shadow-color);
            padding: 4px 8px;
        }
        
        #measurement-display {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1002;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: 500;
        }


        /* --- Iframe Overlay Fullscreen --- */
        .iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #fff;
        }
        #deepstate-iframe, #leaflet-overlay-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        #leaflet-overlay-map {
            z-index: 2;
            background: transparent;
            pointer-events: none;
        }

        .iframe-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            display: flex;
            gap: 10px;
        }
        .iframe-button {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 10px var(--shadow-color);
            border-radius: 8px;
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
            color: var(--text-color);
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .iframe-button:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-1px);
        }
        .iframe-button i {
            font-size: 16px;
        }

        /* --- OTHER STYLES & LEAFLET OVERRIDES --- */
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 3000; display: flex; justify-content: center; align-items: center; }
        .loader { border: 8px solid #f3f3f3; border-radius: 50%; border-top: 8px solid var(--accent-color); width: 60px; height: 60px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .map-placement-mode { cursor: crosshair !important; }

        #coords-display {
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 1000;
            background: transparent;
            padding: 4px 8px;
            font-size: 12px;
            color: var(--text-color);
            text-shadow: 0 0 3px var(--main-bg), 0 0 3px var(--main-bg), 0 0 3px var(--main-bg);
        }
        
        .leaflet-control-zoom { background: transparent !important; border: none !important; box-shadow: none !important; }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out { background: transparent !important; color: var(--text-color) !important; border: none !important; box-shadow: none !important; width: 36px !important; height: 36px !important; line-height: 36px !important; font-size: 22px !important; text-shadow: var(--icon-shadow) !important; }
        .leaflet-control-zoom a:hover { background-color: transparent !important; }
        .leaflet-control-layers-toggle { width: 36px !important; height: 36px !important; background-image: url('data:image/svg+xml;charset=utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%232c2c2c"%3E%3Cpath d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-12h2v4h-2zm0 6h2v2h-2z"/%3E%3C/svg%3E') !important; filter: drop-shadow(var(--icon-shadow)); }
        .leaflet-control-layers { border: 1px solid var(--border-color) !important; background: var(--bg-color) !important; -webkit-backdrop-filter: var(--blur-effect); backdrop-filter: var(--blur-effect); box-shadow: 0 2px 10px var(--shadow-color) !important; color: var(--text-color) !important; }
        body.dark-theme .leaflet-control-layers { color: var(--text-color); }
        body.dark-theme .leaflet-control-layers-toggle { background-image: url('data:image/svg+xml;charset=utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23f5f5f7"%3E%3Cpath d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-12h2v4h-2zm0 6h2v2h-2z"/%3E%3C/svg%3E') !important; }
        .leaflet-routing-container { display: none !important; }
        
        /* --- RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .panel-content { flex-direction: column; max-height: calc(100vh - 150px); }
            .panel-column { min-width: unset; flex-basis: auto !important; }
            .modal-content { width: 95%; }
            #toolbar-settings-button { right: 5px; }
            .action-button, #panel-toggle-button { width: 40px; height: 40px; }
            #coords-display { font-size: 10px; bottom: 30px; } /* Adjust for mobile zoom controls */
        }
        @media (max-height: 500px) and (orientation: landscape) { .panel-content { max-height: calc(100vh - 100px); } }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="panel-toggle-container">
        <button id="panel-toggle-button" title="Аналітична панель">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </div>

    <button id="toolbar-settings-button" title="Налаштувати панель"><i class="fa-solid fa-gears"></i></button>

    <div id="action-buttons"></div>

    <div id="button-templates" style="display: none;">
        <button id="theme-toggle-button" class="action-button" title="Змінити тему"><i class="fa-solid fa-moon"></i></button>
        <button id="sync-button" class="action-button" title="Синхронізувати з Google Sheet"><i class="fa-solid fa-sync"></i><span id="sync-badge"></span></button>
        <button id="deepstate-button" class="action-button" title="Наложение на DeepState Map"><i class="fa-solid fa-layer-group"></i></button>
        <button id="add-point-button" class="action-button" title="Додати власну точку"><i class="fa-solid fa-map-pin"></i></button>
        <button id="draw-button" class="action-button" title="Інструменти малювання"><i class="fa-solid fa-pencil-ruler"></i></button>
        <button id="measure-button" class="action-button" title="Виміряти відстань"><i class="fa-solid fa-ruler-horizontal"></i></button>
        <button id="mortar-button" class="action-button" title="Дальність міномета"><i class="fa-solid fa-bullseye"></i></button>
        <button id="gps-button" class="action-button" title="Знайти моє місцеположення"><i class="fa-solid fa-location-crosshairs"></i></button>
        <button id="upload-button" class="action-button" title="Завантажити логи"><i class="fa-solid fa-upload"></i></button>
        <button id="export-button" class="action-button" title="Експорт (GeoJSON)"><i class="fa-solid fa-file-export"></i></button>
        <button id="install-button" class="action-button" title="Встановити додаток"><i class="fa-solid fa-download"></i></button>
    </div>

    <div id="top-panel" class="ui-element collapsed">
        <div class="panel-header">
            <h2>Аналітична панель</h2>
        </div>
        <div class="panel-content">
            <div class="panel-column" id="calendar-column"><h3>Календар</h3><div id="calendar-container"></div></div>
            <div class="panel-column" id="events-column"><h3 id="events-list-title">Події</h3><ul id="events-list"></ul></div>
            <div class="panel-column" id="layers-column"><h3>Шари карти</h3><div id="layers-container"></div></div>
        </div>
    </div>
    
    <div id="iframe-overlay" class="modal-overlay">
        <div class="iframe-container">
             <div class="iframe-controls">
                 <button id="transfer-coords-button" class="iframe-button" title="Перенести координати з центру екрана"><i class="fa-solid fa-crosshairs"></i> Перенести</button>
                 <button id="iframe-close-button" class="iframe-button" title="Закрити"><i class="fa-solid fa-xmark"></i></button>
             </div>
            <iframe id="deepstate-iframe" src="https://deepstatemap.live" frameborder="0"></iframe>
            <div id="leaflet-overlay-map"></div>
        </div>
    </div>
    
    <input type="file" id="log-file-input" multiple accept=".json" style="display: none;">
    <div id="loader-overlay" class="hidden" style="display:none;"><div class="loader"></div></div>
    <div id="coords-display">Lat: 0.00000, Lng: 0.00000</div>
    <div id="measurement-display" class="ui-element" style="display: none;"></div>

    <script>
        // --- Full application JavaScript ---

        // --- Global constants and variables ---
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWLzQoJq0hfHer7Vsdk2xJe_Z7aNA4SRhiU0NWkMPv3IZAdcMFkyH-GrkXm6WK5SEZ/exec';
        let allLogsData = [], calendar, mapLayersControl, fileLayerGroups = {}, intersectionClusterGroup, selectedCalendarDate = null;
        let mapFeatures = {};
        let lastSyncRowCount = 0;
        let deferredPrompt;
        let customIconCollection = [];
        let drawnItemsHistory = [];
        let currentDrawHandler = null;

        // --- NEW: Mortar Constants ---
        const MORTAR_RANGES = {
            '82mm': { min: 100, max: 4000 },
            '120mm': { min: 480, max: 7100 }
        };

        // --- Map and layers initialization ---
        const map = L.map('map', { zoomControl: false }).setView([50.41, 30.64], 11);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        const baseLayers = {
            "Стандартна": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }),
            "Супутник": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '&copy; Esri' }),
        };
        baseLayers["Стандартна"].addTo(map);

        // --- Feature Layers ---
        let customPointsLayer = L.layerGroup().addTo(map);
        let drawingsLayer = L.layerGroup().addTo(map);
        let measurementLayer = L.layerGroup().addTo(map);

        // --- DOM Element References ---
        const loader = document.getElementById('loader-overlay');
        const logFileInput = document.getElementById('log-file-input');
        const iframeOverlay = document.getElementById('iframe-overlay');
        const iframeCloseButton = document.getElementById('iframe-close-button');
        const panelToggleButton = document.getElementById('panel-toggle-button');
        const topPanel = document.getElementById('top-panel');
        const coordsDisplay = document.getElementById('coords-display');
        const customPointModal = document.getElementById('custom-point-modal-overlay');
        const drawingToolbar = document.getElementById('drawing-toolbar');
        const mortarToolbar = document.getElementById('mortar-toolbar');
        let overlayMap = null;
        let overlayLayersGroup = L.layerGroup();
        
        // --- TOOLBAR CONFIG ---
        const toolbarSettingsButton = document.getElementById('toolbar-settings-button');
        const toolbarSettingsModal = document.getElementById('toolbar-settings-modal-overlay');
        const actionButtonsContainer = document.getElementById('action-buttons');
        const buttonTemplates = document.getElementById('button-templates');
        
        const AVAILABLE_BUTTONS = [
            { id: 'theme-toggle-button', title: 'Змінити тему', icon: 'fa-solid fa-moon' },
            { id: 'sync-button', title: 'Синхронізація', icon: 'fa-solid fa-sync' },
            { id: 'deepstate-button', title: 'DeepState', icon: 'fa-solid fa-layer-group' },
            { id: 'add-point-button', title: 'Додати точку', icon: 'fa-solid fa-map-pin' },
            { id: 'draw-button', title: 'Малювання', icon: 'fa-solid fa-pencil-ruler' },
            { id: 'measure-button', title: 'Виміряти відстань', icon: 'fa-solid fa-ruler-horizontal' },
            { id: 'mortar-button', title: 'Дальність міномета', icon: 'fa-solid fa-bullseye' },
            { id: 'gps-button', title: 'Моє місце', icon: 'fa-solid fa-location-crosshairs' },
            { id: 'upload-button', title: 'Завантажити лог', icon: 'fa-solid fa-upload' },
            { id: 'export-button', title: 'Експорт', icon: 'fa-solid fa-file-export' },
            { id: 'install-button', title: 'Встановити', icon: 'fa-solid fa-download' }
        ];
        
        let visibleButtonIds = [];

        // --- PWA INSTALL LOGIC ---
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            updateButtonVisibilityInSettings('install-button', true);
        });
        
        window.addEventListener('appinstalled', () => {
             deferredPrompt = null;
             updateButtonVisibilityInSettings('install-button', false);
             console.log('PWA was installed');
        });
        
        function updateButtonVisibilityInSettings(buttonId, shouldBeVisible) {
            const buttonConfig = document.querySelector(`.toolbar-button-item input[data-id="${buttonId}"]`);
            if (buttonConfig) {
                 buttonConfig.parentElement.parentElement.style.display = shouldBeVisible ? 'flex' : 'none';
            }
        }

        // --- THEME & UI LOGIC ---
        const toggleTheme = (forceTheme = null) => {
            const body = document.body;
            let isDark = forceTheme ? forceTheme === 'dark' : !body.classList.contains('dark-theme');

            body.classList.toggle('dark-theme', isDark);
            
            const themeIconInTemplate = buttonTemplates.querySelector('#theme-toggle-button i');
            if (themeIconInTemplate) themeIconInTemplate.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            
            const themeIconOnMap = actionButtonsContainer.querySelector('#theme-toggle-button i');
            if (themeIconOnMap) themeIconOnMap.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            
            localStorage.setItem('theme', isDark ? 'dark' : 'light');

            if (isDark) {
                if (map.hasLayer(baseLayers["Стандартна"])) map.removeLayer(baseLayers["Стандартна"]);
                if (!map.hasLayer(baseLayers["Супутник"])) map.addLayer(baseLayers["Супутник"]);
            } else {
                if (map.hasLayer(baseLayers["Супутник"])) map.removeLayer(baseLayers["Супутник"]);
                if (!map.hasLayer(baseLayers["Стандартна"])) map.addLayer(baseLayers["Стандартна"]);
            }
        };
        
        panelToggleButton.addEventListener('click', (e) => {
            e.stopPropagation();
            topPanel.classList.toggle('collapsed');
        });

        document.addEventListener('click', (e) => {
            if (!topPanel.classList.contains('collapsed') && !e.target.closest('#top-panel') && !e.target.closest('#panel-toggle-button')) {
                topPanel.classList.add('collapsed');
            }
        });
        
        iframeCloseButton.addEventListener('click', () => iframeOverlay.classList.remove('visible'));
        
        map.on('mousemove', (e) => {
            coordsDisplay.innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lng: ${e.latlng.lng.toFixed(5)}`;
        });
        
        // --- DRAGGABLE BUTTONS LOGIC ---
        function makeDraggable(element) {
            let isDragging = false, wasDragged = false, offsetX, offsetY, startX, startY;
            const clickThreshold = 5;

            function onDown(e) {
                if (e.button === 2) return;
                isDragging = true;
                wasDragged = false;
                element.classList.add('grabbing');
                const touch = e.type === 'touchstart', event = touch ? e.touches[0] : e;
                startX = event.clientX;
                startY = event.clientY;
                const rect = element.getBoundingClientRect();
                offsetX = event.clientX - rect.left;
                offsetY = event.clientY - rect.top;
                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('mouseup', onUp);
                window.addEventListener('touchend', onUp);
            }

            function onMove(e) {
                if (!isDragging) return;
                if (e.cancelable) e.preventDefault();
                const touch = e.type === 'touchmove', event = touch ? e.touches[0] : e;
                if (!wasDragged && (Math.abs(event.clientX - startX) > clickThreshold || Math.abs(event.clientY - startY) > clickThreshold)) {
                    wasDragged = true;
                }
                let newLeft = event.clientX - offsetX, newTop = event.clientY - offsetY;
                const rect = element.getBoundingClientRect(), parentRect = document.body.getBoundingClientRect();
                newLeft = Math.max(0, Math.min(newLeft, parentRect.width - rect.width));
                newTop = Math.max(0, Math.min(newTop, parentRect.height - rect.height));
                element.style.left = `${newLeft}px`;
                element.style.top = `${newTop}px`;
                element.style.right = 'auto';
            }

            function onUp() {
                isDragging = false;
                element.classList.remove('grabbing');
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('mouseup', onUp);
                window.removeEventListener('touchend', onUp);
                setTimeout(() => { wasDragged = false; }, 0);
            }
            
            element.addEventListener('click', (e) => {
                if (wasDragged) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            element.addEventListener('mousedown', onDown);
            element.addEventListener('touchstart', onDown, { passive: false });
        }
        
        // --- HELPER FUNCTIONS ---
        function filterForIntersection(logs) { return logs.filter(log => log.name && log.azimuth && log.distance && (parseAzimuth(log.azimuth)[1] - parseAzimuth(log.azimuth)[0]) <= 10); }
        function generateHslColor(index, total) { const hue = (index * (360 / total)) % 360; return `hsl(${hue}, 70%, 50%)`; }
        function parseAzimuth(az) { if (typeof az === 'string' && az.includes('-')) return az.split('-').map(Number); return [Number(az), Number(az)]; }
        function getDestPoint(lat, lon, brng, dist) { const R = 6371e3; const l1 = lat * Math.PI / 180, n1 = lon * Math.PI / 180, b = brng * Math.PI / 180; const l2 = Math.asin(Math.sin(l1) * Math.cos(dist / R) + Math.cos(l1) * Math.sin(dist / R) * Math.cos(b)); const n2 = n1 + Math.atan2(Math.sin(b) * Math.sin(dist / R) * Math.cos(l1), Math.cos(dist / R) - Math.sin(l1) * Math.sin(l2)); return [l2 * 180 / Math.PI, n2 * 180 / Math.PI]; }
        function findIntersection(logA, logB) { const azA = (parseAzimuth(logA.azimuth)[0] + parseAzimuth(logA.azimuth)[1]) / 2; const azB = (parseAzimuth(logB.azimuth)[0] + parseAzimuth(logB.azimuth)[1]) / 2; const p1 = logA.originCoordinates, p3 = logB.originCoordinates; const p2 = getDestPoint(p1.lat, p1.lon, azA, 10000), p4 = getDestPoint(p3.lat, p3.lon, azB, 10000); const x1 = p1.lon, y1 = p1.lat, x2 = p2[1], y2 = p2[0], x3 = p3.lon, y3 = p3.lat, x4 = p4[1], y4 = p4[0]; const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4); if (den === 0) return null; const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den; const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den; if (t > 0 && u > 0) return [y1 + t * (y2 - y1), x1 + t * (x2 - x1)]; return null; }
        function calculateDistance(lat1, lon1, lat2, lon2) { const R = 6371e3; const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180; const dP = (lat2 - lat1) * Math.PI / 180, dL = (lon2 - lon1) * Math.PI / 180; const a = Math.sin(dP / 2) * Math.sin(dP / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dL / 2) * Math.sin(dL / 2); const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); return R * c; }

        // --- DATA HANDLING ---
        async function fetchDataFromSheet(isSilent = false) {
            const syncButton = document.querySelector('#sync-button i');
            if (!isSilent && syncButton) {
                syncButton.classList.add('fa-spin');
            }
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                const sheetData = await response.json();
                
                if (isSilent) {
                    const newRowCount = sheetData.length;
                    const newEventsCount = newRowCount - (lastSyncRowCount || 0);
                    const syncBadge = document.querySelector('#sync-badge');
                    if (syncBadge && newEventsCount > 0) {
                        syncBadge.textContent = newEventsCount;
                        syncBadge.style.display = 'flex';
                    } else if (syncBadge) {
                        syncBadge.style.display = 'none';
                    }
                    return;
                }

                lastSyncRowCount = sheetData.length;
                const syncBadge = document.querySelector('#sync-badge');
                if (syncBadge) syncBadge.style.display = 'none';

                allLogsData = sheetData.map((row, index) => ({
                    name: row.Event, timestamp: row.Timestamp, azimuth: row.Azimuth,
                    distance: row.Distance ? parseInt(row.Distance, 10) : null,
                    comment: row.Comment, uniqueId: row.UniqueID || `sheet_${index}`,
                    originCoordinates: { lat: parseFloat(row.Latitude), lon: parseFloat(row.Longitude) },
                    fileName: `Sheet: ${row.Shift} | ${row.Position}`,
                    fileColor: generateHslColor(index, sheetData.length)
                })).filter(log => !isNaN(log.originCoordinates.lat) && !isNaN(log.originCoordinates.lon));
                
                initCalendar();
                updateMap();
                displayEventsList(allLogsData, null);
                
            } catch (error) {
                if (!isSilent) console.error('Failed to load data from Google Sheet.');
                console.error('Fetch error:', error);
            } finally {
                if (!isSilent && syncButton) {
                    syncButton.classList.remove('fa-spin');
                }
            }
        }
        
        function handleFileSelect(event) {
            loader.style.display = 'flex'; // Full loader for file processing is ok
            allLogsData = [];
            let logIdCounter = 0;
            const files = Array.from(event.target.files);
            const promises = files.map((file, index) => new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        let processedLogs = [];
                        if (data.events && data.position && data.position.location) {
                            const originCoordinates = { lat: data.position.location.lat, lon: data.position.location.lon };
                            data.events.forEach(event => processedLogs.push({ ...event, uniqueId: `log_${logIdCounter++}`, originCoordinates, fileName: file.name, fileColor: generateHslColor(index, files.length) }));
                        } else if (data.logs && data.originCoordinates) {
                            data.logs.forEach(log => processedLogs.push({ ...log, uniqueId: `log_${logIdCounter++}`, originCoordinates, fileName: file.name, fileColor: generateHslColor(index, files.length) }));
                        }
                        allLogsData.push(...processedLogs);
                    } catch (error) { console.error(`Error parsing file ${file.name}.`); }
                    resolve();
                };
                reader.readAsText(file);
            }));
            Promise.all(promises).then(() => {
                initCalendar(); updateMap(); displayEventsList(allLogsData, null);
                topPanel.classList.remove('collapsed');
                loader.style.display = 'none';
            });
        }

        // --- MAP & UI UPDATE LOGIC ---
        function updateMap() {
            if (mapLayersControl) map.removeControl(mapLayersControl);
            Object.values(fileLayerGroups).forEach(group => map.removeLayer(group));
            if (intersectionClusterGroup) map.removeLayer(intersectionClusterGroup);
            
            fileLayerGroups = {};
            mapFeatures = {};
            
            let filteredLogs = allLogsData.filter(log => !selectedCalendarDate || log.timestamp.startsWith(selectedCalendarDate));
            drawLogVisuals(filteredLogs);
            calculateAndDrawIntersections(filterForIntersection(filteredLogs));
        }
        
        function drawLogVisuals(logsToDraw) {
            const overlayMaps = {};
            const logsByFile = logsToDraw.reduce((acc, log) => {
                (acc[log.fileName] = acc[log.fileName] || []).push(log);
                return acc;
            }, {});

            for (const fileName in logsByFile) {
                const logs = logsByFile[fileName];
                if (logs.length === 0) continue;
                const fileColor = logs[0].fileColor;
                const fileGroup = L.layerGroup();
                const originsDrawn = new Set();
                logs.forEach(log => {
                    const originKey = `${log.originCoordinates.lat},${log.originCoordinates.lon}`;
                    if (!originsDrawn.has(originKey)) {
                        L.marker([log.originCoordinates.lat, log.originCoordinates.lon], { icon: L.divIcon({ className: 'fa-solid fa-user-secret', iconSize: [20, 20], html: `<i class="fa-solid fa-user-secret" style="color: ${fileColor}; font-size: 20px;"></i>` }) }).addTo(fileGroup).bindPopup(`<b>Спостерігач</b><br>${fileName}`);
                        originsDrawn.add(originKey);
                    }
                    if (log.azimuth && log.distance) drawObservation(log, fileGroup);
                });
                fileLayerGroups[fileName] = fileGroup;
                overlayMaps[`<span class="layer-legend-color" style="background-color:${fileColor};"></span> ${fileName.substring(0, 25)}...`] = fileGroup;
            }

            if (intersectionClusterGroup && intersectionClusterGroup.getLayers().length > 0) {
                overlayMaps[`<i class="fa-solid fa-crosshairs" style="color:#d92f2f;"></i> Перетини`] = intersectionClusterGroup;
            }
            overlayMaps[`<i class="fa-solid fa-map-pin" style="color:var(--accent-color);"></i> Мої точки`] = customPointsLayer;
            overlayMaps[`<i class="fa-solid fa-pencil" style="color:#f5a623;"></i> Малюнки`] = drawingsLayer;
            overlayMaps[`<i class="fa-solid fa-ruler-horizontal" style="color:#FFD700;"></i> Вимірювання`] = measurementLayer;


            mapLayersControl = L.control.layers(null, overlayMaps, { collapsed: true }).addTo(map);
            
            Object.values(fileLayerGroups).forEach(group => map.addLayer(group));
            if (intersectionClusterGroup) map.addLayer(intersectionClusterGroup);
        }
        
        function drawObservation(log, layerGroup, isOverlay = false) {
            const originPoint = [log.originCoordinates.lat, log.originCoordinates.lon];
            const avgAzimuth = (parseAzimuth(log.azimuth)[0] + parseAzimuth(log.azimuth)[1]) / 2;
            const targetPoint = getDestPoint(originPoint[0], originPoint[1], avgAzimuth, log.distance);
            
            const polyline = L.polyline([originPoint, targetPoint], { color: log.fileColor, weight: 3, opacity: 0.9 }).addTo(layerGroup);
            const marker = L.circle(targetPoint, { color: log.fileColor, fillColor: log.fileColor, fillOpacity: 0.4, radius: 25 }).addTo(layerGroup);

            if (!isOverlay) {
                marker.on('click', () => openEventModal(log, targetPoint));
                mapFeatures[log.uniqueId] = { marker, polyline };
            }
        }

        function calculateAndDrawIntersections(logs) {
            intersectionClusterGroup = L.markerClusterGroup();
            for (let i = 0; i < logs.length; i++) {
                for (let j = i + 1; j < logs.length; j++) {
                    const logA = logs[i], logB = logs[j];
                    if (logA.fileName === logB.fileName) continue;
                    const iPoint = findIntersection(logA, logB);
                    if (iPoint) {
                        const popup = `<b>Перетин</b><br><b>Коорд:</b> ${iPoint[0].toFixed(5)}, ${iPoint[1].toFixed(5)}`;
                        const marker = L.marker(iPoint, { icon: L.divIcon({ className: 'fa-solid fa-crosshairs intersection-icon' }) }).bindPopup(popup);
                        intersectionClusterGroup.addLayer(marker);
                    }
                }
            }
        }

        function initCalendar() {

                        displayEventsList(eventsForDate, selectedCalendarDate);
                        updateMap();
                    }
                },
                settings: { visibility: { highlighted: eventDates } },
            };
            if (calendar) calendar.destroy();
            const calendarContainer = document.getElementById('calendar-container');
            if(calendarContainer) {
                calendar = new VanillaCalendar(calendarContainer, options);
                calendar.init();
            }
        }

            const list = document.getElementById('events-list');

        function processImageForIcon(imageUrl, processingType) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    const size = 48; 
                    canvas.width = size;
                    canvas.height = size;

                    ctx.drawImage(img, 0, 0, size, size);

                    if (processingType === 'white-to-transparent') {
                        const imageData = ctx.getImageData(0, 0, size, size);
                        const data = imageData.data;
                        for (let i = 0; i < data.length; i += 4) {
                            if (data[i] > 240 && data[i + 1] > 240 && data[i + 2] > 240) {
                                data[i + 3] = 0; // Set alpha to 0
                            }
                        }
                        ctx.putImageData(imageData, 0, 0);
                    }
                    resolve(canvas.toDataURL());
                };
                img.onerror = reject;
                img.src = imageUrl;
            });
        }

        document.getElementById('place-point-submit').addEventListener('click', () => {
            const name = document.getElementById('point-name-input').value.trim() || "Без назви";
            const coordSource = document.querySelector('input[name="point-coord-source"]:checked').value;
            const iconSource = document.querySelector('input[name="point-icon-source"]:checked').value;

            let iconPromise;

            switch (iconSource) {
                case 'url':
                case 'file':
                    const processingType = document.querySelector('input[name="icon-background-processing"]:checked').value;
                    let imageUrlPromise = iconSource === 'url'
                        ? Promise.resolve(document.getElementById('point-url-input').value.trim())
                        : new Promise((resolve, reject) => {
                            const file = document.getElementById('point-file-input').files[0];
                            if (!file) { reject('Файл не обрано'); return; }
                            const reader = new FileReader();
                            reader.onload = e => resolve(e.target.result);
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });

                    iconPromise = imageUrlPromise
                        .then(url => {
                            if(!url) throw new Error("URL або файл порожні");
                            return processImageForIcon(url, processingType)
                        })
                        .then(dataUrl => {
                            saveCustomIcon(dataUrl);
                            return L.icon({ iconUrl: dataUrl, iconSize: [32, 32], iconAnchor: [16, 32] });
                        });
                    break;
                
                case 'collection':
                    const selectedIcon = document.querySelector('.icon-collection-item.selected');
                    if (!selectedIcon) { alert('Будь ласка, оберіть іконку з колекції.'); return Promise.reject(); }
                    iconPromise = Promise.resolve(L.icon({ iconUrl: selectedIcon.src, iconSize: [32, 32], iconAnchor: [16, 32] }));
                    break;
                
                // NEW: Military Icon Case
                case 'military':
                    const selectedMilitaryIcon = document.querySelector('.military-icon-item.selected');
                    if (!selectedMilitaryIcon) { alert('Будь ласка, оберіть військовий значок.'); return Promise.reject(); }
                    const iconSVG = selectedMilitaryIcon.dataset.svg;
                    const iconColor = document.getElementById('military-icon-color-picker').value;
                    const coloredSVG = iconSVG.replace(/currentColor/g, iconColor);
                    const svgDataUrl = 'data:image/svg+xml;base64,' + btoa(coloredSVG);
                    iconPromise = Promise.resolve(L.icon({ iconUrl: svgDataUrl, iconSize: [32, 32], iconAnchor: [16, 16] }));
                    break;

                default: // 'default'
                    iconPromise = Promise.resolve(L.divIcon({ className: 'fa-solid fa-map-pin', iconSize: [24, 24], html: `<i class="fa-solid fa-map-pin" style="font-size: 24px; color: var(--accent-color);"></i>` }));
                    break;
            }

            iconPromise.then(finalIcon => {
                if (coordSource === 'manual') {
                    const lat = parseFloat(document.getElementById('point-lat-input').value);
                    const lng = parseFloat(document.getElementById('point-lng-input').value);
                    if (isNaN(lat) || isNaN(lng)) { alert('Будь ласка, введіть коректні координати.'); return; }
                    startMarkerPlacement(name, finalIcon, L.latLng(lat, lng));
                } else {
                    startMarkerPlacement(name, finalIcon, null);
                }
            }).catch(error => {
                console.error("Помилка створення іконки:", error);
                if (error) alert("Не вдалося створити іконку. " + error);
            });
        });
        
        function startMarkerPlacement(name, icon, latlng = null) {
            const placeMarker = (pos) => {
                L.marker(pos, { icon: icon, draggable: true }).addTo(customPointsLayer)
                    .bindPopup(`<b>${name}</b><br>Коорд: ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`).openPopup();
                document.getElementById('map').classList.remove('map-placement-mode');
            };

            customPointModal.classList.remove('visible');
            if (latlng) {
                placeMarker(latlng);
            } else {
                document.getElementById('map').classList.add('map-placement-mode');
                map.once('click', (e) => placeMarker(e.latlng));
            }
        }

        function stopCurrentMapAction() {

                currentDrawHandler.disable();
                currentDrawHandler = null;

            document.querySelectorAll('.draw-tool-button.active').forEach(b => b.classList.remove('active'));

        function startMeasurement() {
            stopCurrentMapAction();
            document.getElementById('map').classList.add('map-placement-mode');
            let tempLayer = L.layerGroup().addTo(map);
            let firstPoint = null;
            const measurementDisplay = document.getElementById('measurement-display');

            const clickHandler = (e) => {
                if (!firstPoint) {
                    firstPoint = e.latlng;
                    L.circleMarker(firstPoint, { radius: 4, color: document.getElementById('drawing-color-picker').value }).addTo(tempLayer);
                } else {
                    const secondPoint = e.latlng;
                    
                    const routingControl = L.Routing.control({
                        waypoints: [firstPoint, secondPoint],
                        routeWhileDragging: false, show: false, addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: false,
                        lineOptions: { styles: [{ color: document.getElementById('drawing-color-picker').value, opacity: 0.8, weight: 5 }] },
                        createMarker: function() { return null; }
                    }).addTo(map);

                    routingControl.on('routesfound', function(e) {
                        const route = e.routes[0];
                        const routeLine = L.polyline(route.coordinates, {
                            color: document.getElementById('drawing-color-picker').value, opacity: 0.8, weight: 5
                        }).addTo(measurementLayer);
                        
                        const distance = route.summary.totalDistance;
                        const formattedDist = distance > 1000 ? `${(distance / 1000).toFixed(2)} km` : `${Math.round(distance)} m`;
                        
                        const label = L.marker(routeLine.getCenter(), {
                            icon: L.divIcon({ className: 'distance-label', html: formattedDist })
                        }).addTo(measurementLayer);

                        drawnItemsHistory.push(routeLine, label);
                        map.removeControl(routingControl);
                    });
                    
                    routingControl.on('routingerror', function(e) {
                        console.warn("Routing error, falling back to straight line:", e.error);
                        const line = L.polyline([firstPoint, secondPoint], {
                            color: document.getElementById('drawing-color-picker').value, opacity: 0.8, weight: 5, dashArray: '5, 5'
                        }).addTo(measurementLayer);
                        
                        const distance = firstPoint.distanceTo(secondPoint);
                        const formattedDist = distance > 1000 ? `${(distance / 1000).toFixed(2)} km` : `${Math.round(distance)} m`;
                        
                        const label = L.marker(line.getCenter(), {
                           icon: L.divIcon({ className: 'distance-label', html: `~ ${formattedDist}` })
                        }).addTo(measurementLayer);

                        drawnItemsHistory.push(line, label);
                        map.removeControl(routingControl);
                   });

                    map.off('click', clickHandler);
                    map.off('mousemove', moveHandler);
                    tempLayer.clearLayers();
                    L.DomUtil.removeClass(map._container, 'map-placement-mode');
                    measurementDisplay.style.display = 'none';
                }
            };
            
            const moveHandler = (e) => {
                if (firstPoint) {
                    const distance = firstPoint.distanceTo(e.latlng);
                    const formattedDist = distance > 1000 ? `${(distance / 1000).toFixed(2)} km` : `${Math.round(distance)} m`;
                    measurementDisplay.innerHTML = `Дистанція: ${formattedDist}`;
                    measurementDisplay.style.display = 'block';
                }
            };
            
            map.on('click', clickHandler);
            map.on('mousemove', moveHandler);
            
            currentDrawHandler = {
                disable: () => {
                    map.off('click', clickHandler);
                    map.off('mousemove', moveHandler);
                    tempLayer.clearLayers();
                    L.DomUtil.removeClass(map._container, 'map-placement-mode');
                    measurementDisplay.style.display = 'none';
                }
            };
        }
        
        document.getElementById('close-draw-toolbar').addEventListener('click', () => {
            stopCurrentMapAction();
            drawingToolbar.style.display = 'none';
        });

        document.getElementById('undo-draw-button').addEventListener('click', () => {
            const lastItem = drawnItemsHistory.pop();
            if (lastItem) {
                drawingsLayer.removeLayer(lastItem);
                measurementLayer.removeLayer(lastItem);
            }
        });
        
        drawingToolbar.addEventListener('click', (e) => {
            const button = e.target.closest('.draw-tool-button');
            if (!button || button.id === 'undo-draw-button' || button.id === 'close-draw-toolbar') return;
            
            stopCurrentMapAction();
            button.classList.add('active');
            
            const drawType = button.dataset.drawType;
            let startPoint = null;
            let tempShape = null;
            const options = { color: document.getElementById('drawing-color-picker').value, weight: 3 };
            if (drawType === 'dashed') options.dashArray = '5, 10';

            const onMouseDown = (e_down) => {
                startPoint = e_down.latlng;
                map.on('mousemove', onMouseMove);
                map.on('mouseup', onMouseUp);
            };

            const onMouseMove = (e_move) => {
                if (!startPoint) return;
                const currentPoint = e_move.latlng;
                if (tempShape) map.removeLayer(tempShape);

                if (drawType === 'rectangle') {
                    tempShape = L.rectangle(L.latLngBounds(startPoint, currentPoint), options).addTo(map);
                } else if (drawType === 'circle') {
                    const radius = startPoint.distanceTo(currentPoint);
                    tempShape = L.circle(startPoint, { ...options, radius: radius }).addTo(map);
                }
            };

            const onMouseUp = (e_up) => {
                map.off('mousemove', onMouseMove);
                map.off('mouseup', onMouseUp);
                if (tempShape) {
                    drawingsLayer.addLayer(tempShape);
                    drawnItemsHistory.push(tempShape);
                    tempShape = null;
                }
                stopCurrentMapAction();
            };

            const onTwoClicks = (e) => {
                if (!startPoint) {
                    startPoint = e.latlng;
                } else {
                    const finalLayer = L.polyline([startPoint, e.latlng], options).addTo(drawingsLayer);
                    drawnItemsHistory.push(finalLayer);
                    if (drawType === 'arrow') {
                        const decorator = L.polylineDecorator(finalLayer, {
                            patterns: [{ offset: '100%', symbol: L.Symbol.arrowHead({ pixelSize: 15, pathOptions: { stroke: true, color: options.color } }) }]
                        }).addTo(drawingsLayer);
                         drawnItemsHistory.push(decorator);
                    }
                    map.off('click', onTwoClicks);
                    stopCurrentMapAction();
                }
            };
            
            document.getElementById('map').classList.add('map-placement-mode');
            
            if (drawType === 'rectangle' || drawType === 'circle') {
                 map.once('mousedown', onMouseDown);
            } else {
                 map.on('click', onTwoClicks);
            }

            currentDrawHandler = {
                disable: () => {
                    map.off('mousedown', onMouseDown);
                    map.off('mousemove', onMouseMove);
                    map.off('mouseup', onMouseUp);
                    map.off('click', onTwoClicks);
                    if(tempShape) map.removeLayer(tempShape);
                }
            }
        });

        // --- NEW: Mortar Logic ---
        document.getElementById('close-mortar-toolbar').addEventListener('click', () => {
            stopCurrentMapAction();
            mortarToolbar.style.display = 'none';
        });

        mortarToolbar.addEventListener('click', (e) => {
            const button = e.target.closest('.draw-tool-button');
            if (!button || button.id === 'close-mortar-toolbar') return;

            stopCurrentMapAction();
            button.classList.add('active');

            const mortarType = button.dataset.mortarType;
            const ranges = MORTAR_RANGES[mortarType];
            if (!ranges) return;

            startMortarPlacement(ranges.min, ranges.max, mortarType);
        });

        function startMortarPlacement(minRange, maxRange, type) {
            document.getElementById('map').classList.add('map-placement-mode');

            const placeMortar = (pos) => {
                const rangeGroup = L.layerGroup();

                const minCircle = L.circle(pos, { radius: minRange, color: '#f5a623', weight: 2, dashArray: '5, 5', fillOpacity: 0.1 }).addTo(rangeGroup);
                const maxCircle = L.circle(pos, { radius: maxRange, color: '#d0021b', weight: 2, fillOpacity: 0.1 }).addTo(rangeGroup);
                const center = L.marker(pos, { icon: L.divIcon({ className: 'fa-solid fa-bullseye', html: `<i class="fa-solid fa-bullseye" style="color: #d0021b;"></i>`})}).addTo(rangeGroup);
                
                center.bindPopup(`<b>Міномет ${type}</b><br>Дальність: ${minRange}м - ${maxRange}м`).openPopup();
                
                drawingsLayer.addLayer(rangeGroup);
                drawnItemsHistory.push(rangeGroup);
                stopCurrentMapAction();
            };

            map.once('click', placeMortar);

            currentDrawHandler = {
                disable: () => {
                    map.off('click', placeMortar);
                }
            };
        }
        
        // --- NEW: Military Icon Data (APP-6 Standard) ---
        const MILITARY_ICONS = {
            'Friendly': {
                'Infantry': '<g transform="translate(100 100) scale(0.8 0.8)"><line x1="-80" y1="80" x2="80" y2="-80" stroke="currentColor" stroke-width="12" /><line x1="80" y1="80" x2="-80" y2="-80" stroke="currentColor" stroke-width="12" /></g>',
                'Armor': '<g transform="translate(100 100) scale(0.8 0.8)"><ellipse cx="0" cy="0" rx="90" ry="60" stroke="currentColor" stroke-width="12" fill="none"/></g>',
                'Artillery': '<g transform="translate(100 100) scale(0.8 0.8)"><circle cx="0" cy="0" r="20" fill="currentColor"/></g>',
                'Observation Post': '<g transform="translate(100 100) scale(0.8 0.8)"><line x1="0" y1="-80" x2="0" y2="80" stroke="currentColor" stroke-width="12" /><line x1="-80" y1="0" x2="-20" y2="0" stroke="currentColor" stroke-width="12" /><line x1="-80" y1="0" x2="-50" y2="-30" stroke="currentColor" stroke-width="12" /></g>'
            },
            'Hostile': {
                'Infantry': '<g transform="translate(100 100) scale(0.8 0.8)"><line x1="-80" y1="80" x2="80" y2="-80" stroke="currentColor" stroke-width="12" /><line x1="80" y1="80" x2="-80" y2="-80" stroke="currentColor" stroke-width="12" /></g>',
                'Armor': '<g transform="translate(100 100) scale(0.8 0.8)"><ellipse cx="0" cy="0" rx="90" ry="60" stroke="currentColor" stroke-width="12" fill="none"/></g>',
                'Artillery': '<g transform="translate(100 100) scale(0.8 0.8)"><circle cx="0" cy="0" r="20" fill="currentColor"/></g>',
                 'Mortar': '<g transform="translate(100 100) scale(0.8 0.8)"><circle cx="0" cy="0" r="20" fill="currentColor"/><line x1="0" y1="20" x2="0" y2="70" stroke="currentColor" stroke-width="12"/><path d="M 0 70 L 20 90" stroke="currentColor" stroke-width="12" fill="none"/></g>'
            },
            'Neutral': {
                'Infantry': '<g transform="translate(100 100) scale(0.8 0.8)"><line x1="-80" y1="80" x2="80" y2="-80" stroke="currentColor" stroke-width="12" /><line x1="80" y1="80" x2="-80" y2="-80" stroke="currentColor" stroke-width="12" /></g>',
            },
            'Unknown': {
                'Unit': '<g transform="translate(100 100) scale(0.8 0.8)"></g>',
            }
        };

        function getMilitaryFrame(category) {
            switch (category) {
                case 'Friendly': return '<rect x="5" y="5" width="190" height="123.3" rx="10" ry="10" stroke="currentColor" stroke-width="10" fill="none" />';
                case 'Hostile': return '<path d="M 5,66.65 L 100,5 L 195,66.65 L 100,128.3 Z" stroke="currentColor" stroke-width="10" fill="none" />';
                case 'Neutral': return '<rect x="5" y="5" width="190" height="123.3" stroke="currentColor" stroke-width="10" fill="none" />';
                case 'Unknown': return '<path d="M 5,66.65 C 5,5 195,5 195,66.65 S 5,128.3 5,66.65 Z" stroke="currentColor" stroke-width="10" fill="none"/>';
                default: return '';
            }
        }

        function populateMilitaryIconCategories() {
            const container = document.getElementById('military-icon-categories');
            container.innerHTML = '';
            Object.keys(MILITARY_ICONS).forEach(category => {
                const button = document.createElement('button');
                button.className = 'category-button';
                button.textContent = category === 'Friendly' ? 'Дружні' : category === 'Hostile' ? 'Ворожі' : category === 'Neutral' ? 'Нейтральні' : 'Невідомі';
                button.dataset.category = category;
                if (category === 'Friendly') button.classList.add('active');
                container.appendChild(button);
            });
            container.addEventListener('click', (e) => {
                if (e.target.matches('.category-button')) {
                    document.querySelectorAll('.category-button.active').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    populateMilitaryIcons(e.target.dataset.category);
                }
            });
        }
        
        function populateMilitaryIcons(category) {
            const grid = document.getElementById('military-icon-grid');
            grid.innerHTML = '';
            const frame = getMilitaryFrame(category);
            const icons = MILITARY_ICONS[category];
            for (const name in icons) {
                const svgContent = `<svg viewBox="0 0 200 133.3">${frame}${icons[name]}</svg>`;
                const img = document.createElement('img');
                img.src = 'data:image/svg+xml;base64,' + btoa(svgContent.replace(/currentColor/g, 'black'));
                img.className = 'military-icon-item';
                img.title = name;
                img.dataset.svg = svgContent;
                img.onclick = () => {
                    document.querySelectorAll('.military-icon-item.selected').forEach(el => el.classList.remove('selected'));
                    img.classList.add('selected');
                };
                grid.appendChild(img);
            }
        }

        // --- APPLICATION STARTUP ---
        window.addEventListener('load', () => {
            loadCustomIcons();
            loadButtonConfig();
            renderVisibleButtons();
            
            const savedTheme = localStorage.getItem('theme');
            toggleTheme(savedTheme || 'light');
            
            fetchDataFromSheet();
            setInterval(() => fetchDataFromSheet(true), 30000);
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(r => console.log('SW registered')).catch(e => console.log('SW reg failed', e));
            });
        }
    </script>
</body>
